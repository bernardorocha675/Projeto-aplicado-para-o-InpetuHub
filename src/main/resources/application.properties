spring.application.name=inpetu-hub
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inpetu_hub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:inpetu}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.seed-demo=${SEED_DEMO:true}
app.admin-login=${ADMIN_LOGIN:admin@inpetuhub.local}
app.admin-password=${ADMIN_PASSWORD:Inpetu@123}
app.timezone=America/Sao_Paulo
server.error.include-message=never
