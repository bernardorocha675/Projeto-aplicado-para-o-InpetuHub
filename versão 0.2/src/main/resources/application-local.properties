# Desenvolvimento sem servidor MySQL instalado.
spring.config.import=optional:file:./.env.local[.properties]
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/inpetu-v02;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
