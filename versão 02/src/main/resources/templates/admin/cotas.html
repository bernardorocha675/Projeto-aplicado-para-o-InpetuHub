<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Cotas mensais')}"></head><body class="admin-body">
 <header th:replace="~{fragments :: topo}"></header><aside th:replace="~{fragments :: menu}"></aside><main class="admin-main"><div th:replace="~{fragments :: mensagens}"></div><div class="page-heading"><h1>Cotas mensais</h1><a href="/admin/config" class="button secondary">Administração</a></div><section class="card"><form th:action="@{/admin/config/cotas}" method="get" class="filters"><label>Mês<input name="mes" type="month" th:value="${mes}" required></label><button>Consultar</button></form><div class="table-scroll"><table><thead><tr><th>Persona</th><th>Total</th><th>Utilizada + dívida anterior</th><th>Pendente</th><th>Saldo</th><th>Dívida para próximo mês</th></tr></thead><tbody><tr th:each="c:${cotas}"><td th:text="${c.persona.codigo}"></td><td th:text="${c.horasTotais}+'h'"></td><td th:text="${c.horasUtilizadas}+'h'"></td><td th:text="${c.horasReservadasPendentes}+'h'"></td><td th:text="${c.saldo}+'h'"></td><td th:text="${c.saldoDevedor}+'h'"></td></tr></tbody></table></div><p class="muted">Horas não acumulam. Dívidas de penalidades são abatidas das cotas seguintes.</p></section></main><footer th:replace="~{fragments :: rodape}"></footer><script src="/js/admin.js" defer></script></body></html>
