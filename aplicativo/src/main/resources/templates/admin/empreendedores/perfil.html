<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Perfil do empreendedor')}"></head>
  <body class="admin-body">
    <header th:replace="~{fragments :: topo}"></header>
    <aside th:replace="~{fragments :: menu}"></aside>
    <main id="conteudo" class="admin-main">
      <div th:replace="~{fragments :: mensagens}"></div>
      <div class="page-heading">
        <div>
          <span class="eyebrow blue">RELACIONAMENTO</span>
          <h1 th:text="${e.nome}"></h1>
          <p th:text="${e.empresa}"></p>
        </div>
        <a th:href="@{/admin/cadastros/empreendedores/editar(id=${e.id})}" class="button">Editar dados</a>
      </div>
      <nav class="tabs">
        <a href="#dados">Dados</a><a href="#reservas">Reservas</a><a href="#atendimentos">Atendimentos</a><a href="#visitas">Visitas</a
        ><a href="#historico">Histórico</a>
      </nav>
      <section class="card" id="dados">
        <h2>Dados cadastrais</h2>
        <dl>
          <dt>Documento</dt>
          <dd th:text="${T(br.com.inpetu.hub.validation.Documentos).exibir(e.tipoDocumento,e.cnpj)}"></dd>
          <dt>Email</dt>
          <dd th:text="${e.email}"></dd>
          <dt>Telefone</dt>
          <dd th:text="${e.telefone}"></dd>
          <dt>Cidade</dt>
          <dd th:text="${e.cidade}"></dd>
          <dt>Segmento / cargo</dt>
          <dd th:text="${e.segmento}+' / '+${e.cargo}"></dd>
          <dt>Ativo</dt>
          <dd th:text="${e.ativo}?'Sim':'Não'"></dd>
        </dl>
      </section>
      <section class="card" id="reservas">
        <h2>Reservas</h2>
        <div th:replace="~{fragments :: tabelaReservas(${reservas})}"></div>
      </section>
      <section class="card" id="atendimentos">
        <h2>Atendimentos</h2>
        <p th:if="${#lists.isEmpty(atendimentos)}" class="muted">Sem atendimentos registrados.</p>
        <article th:each="a:${atendimentos}" class="history-card">
          <strong th:text="${a.data}+' · '+${a.colaborador.nome}"></strong>
          <p th:text="${a.descricao}"></p>
          <p th:text="${a.observacoes}"></p>
          <p th:text="${a.encaminhamentos}"></p>
          <a th:href="@{/admin/cadastros/atendimentos/editar(id=${a.id})}">Editar atendimento</a>
        </article>
      </section>
      <section class="card" id="visitas">
        <h2>Visitas</h2>
        <p th:if="${#lists.isEmpty(visitas)}" class="muted">Sem visitas registradas.</p>
        <article th:each="v:${visitas}" class="history-card">
          <strong th:text="${v.data}+' · '+${v.horario}+' · '+${v.status}"></strong>
          <p th:text="${v.objetivo}"></p>
          <p th:text="${v.participantes}+' participantes · '+${v.colaborador.nome}"></p>
          <a th:href="@{/admin/cadastros/visitas/editar(id=${v.id})}">Editar visita</a>
        </article>
      </section>
      <section class="card" id="historico">
        <h2>Histórico de reservas</h2>
        <ol class="timeline">
          <li th:each="h:${historico}">
            <a th:href="@{/admin/reservas/{id}(id=${h.reserva.id})}" th:text="'Reserva #'+${h.reserva.id}+' — '+${h.acao}"></a
            ><small th:text="${h.dataHora}"></small>
            <p th:text="${h.descricao}"></p>
          </li>
        </ol>
      </section>
    </main>
    <footer th:replace="~{fragments :: rodape}"></footer>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
