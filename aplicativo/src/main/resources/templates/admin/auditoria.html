<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Auditoria')}"></head>
  <body class="admin-body">
    <header th:replace="~{fragments :: topo}"></header>
    <aside th:replace="~{fragments :: menu}"></aside>
    <main id="conteudo" class="admin-main">
      <h1>Auditoria</h1>
      <p>Últimos 200 eventos. Este painel não permite editar nem excluir registros.</p>
      <table>
        <thead>
          <tr>
            <th>Momento</th>
            <th>Autor (ID)</th>
            <th>Evento</th>
            <th>Alvo</th>
            <th>Resultado</th>
            <th>Detalhes</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="i:${items}">
            <td th:text="${i.instante}"></td>
            <td th:text="${i.autorId}"></td>
            <td th:text="${i.evento}"></td>
            <td th:text="${i.alvo}+' #'+${i.alvoId}"></td>
            <td th:text="${i.resultado}"></td>
            <td th:text="${i.detalhes}"></td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
