<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Dashboard')}"></head>
  <body class="admin-body">
    <header th:replace="~{fragments :: topo}"></header>
    <aside th:replace="~{fragments :: menu}"></aside>
    <main id="conteudo" class="admin-main">
      <div th:replace="~{fragments :: mensagens}"></div>
      <div class="page-heading">
        <div>
          <span class="eyebrow blue">VISÃO GERAL</span>
          <h1>Dashboard</h1>
          <p>Reservas e conexões em um único lugar.</p>
        </div>
        <a href="/agenda" class="button secondary">Abrir agenda pública</a>
      </div>
      <div class="stats">
        <article class="card">
          <span>Reservas pendentes</span><strong th:text="${pendentes}"></strong
          ><a href="/admin/reservas?status=PENDENTE" class="link-toque">Analisar solicitações →</a>
        </article>
        <article class="card"><span>Reservas de hoje</span><strong th:text="${hoje}"></strong></article>
        <article class="card">
          <span>Empreendedores</span><strong th:text="${totalEmpreendedores}"></strong
          ><a href="/admin/cadastros/empreendedores" class="link-toque">Consultar CRM →</a>
        </article>
      </div>
      <section class="card">
        <h2>Últimas solicitações</h2>
        <div th:replace="~{fragments :: tabelaReservas(${ultimas})}"></div>
      </section>
      <section class="card">
        <h2>Próximas reservas</h2>
        <div th:replace="~{fragments :: tabelaReservas(${proximas})}"></div>
      </section>
    </main>
    <footer th:replace="~{fragments :: rodape}"></footer>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
