<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Editar cadastro')}"></head><body class="admin-body">
 <header th:replace="~{fragments :: topo}"></header><aside th:replace="~{fragments :: menu}"></aside><main class="admin-main"><div th:replace="~{fragments :: mensagens}"></div><div class="page-heading"><div><h1 th:text="${secao.titulo}"></h1><p th:text="${id!=null ? 'Editar cadastro #'+id : 'Novo cadastro'}"></p></div><a th:href="${rota}" class="button secondary">Voltar</a></div><form th:action="${rota}+'/salvar'" method="post" class="card" th:attr="data-repeat-submit=${tipo=='espacos'||tipo=='empreendedores'?'true':null}"><input th:if="${id!=null}" type="hidden" name="id" th:value="${id}"><div class="form-grid"><th:block th:each="c:${secao.campos}"><fieldset th:if="${c.tipo=='objetivos'}" class="objetivos"><legend th:text="${c.rotulo+' *'}"></legend><p class="muted">Marque um ou mais; use Outro para o que não estiver na lista.</p><input type="hidden" th:name="${c.nome+'__form'}" value="1"><label th:each="op,iter:${crud.objetivoOpcoes()}" class="check"><input type="checkbox" th:name="${c.nome+'__'+iter.index}" value="on" th:checked="${crud.objetivoMarcado(registro,c.nome,op)}"><span th:text="${op}"></span></label><label>Outro<input type="text" th:name="${c.nome+'__outro'}" th:value="${crud.objetivoOutro(registro,c.nome)}" maxlength="500" placeholder="Descreva outro objetivo"></label></fieldset><label th:unless="${c.tipo=='objetivos'}" th:classappend="${c.tipo=='checkbox'}?'check':''"><span th:text="${c.rotulo+(c.obrigatorio&&c.tipo!='checkbox'?' *':'')}"></span><select th:if="${c.tipo=='select'}" th:name="${c.nome}" th:required="${c.obrigatorio}"><option th:each="entry:${c.opcoes}" th:value="${entry.key}" th:text="${entry.value}" th:selected="${entry.key==crud.valor(registro,c.nome)}"></option></select><textarea th:if="${c.tipo=='textarea'}" th:name="${c.nome}" th:text="${crud.valor(registro,c.nome)}" th:required="${c.obrigatorio}" maxlength="2000"></textarea><input th:if="${c.tipo=='checkbox'}" type="checkbox" th:name="${c.nome}" th:checked="${registro==null||crud.valor(registro,c.nome)=='true'}"><input th:unless="${c.tipo=='select'||c.tipo=='textarea'||c.tipo=='checkbox'}" th:type="${c.tipo}" th:name="${c.nome}" th:value="${crud.valor(registro,c.nome)}" th:required="${c.obrigatorio}" th:attr="step=${c.tipo=='number'?(tipo=='espacos'&&c.nome=='capacidade'?'1':'0.01'):null},min=${tipo=='espacos'&&c.nome=='capacidade'?'1':null},max=${tipo=='espacos'&&c.nome=='capacidade'?'2147483647':null}" th:pattern="${tipo=='empreendedores'?contactPatterns[c.nome]:null}" maxlength="255" th:readonly="${tipo=='personas'&&c.nome=='codigo'}"></label></th:block></div><p th:if="${tipo=='configuracao'}" class="alert warning">Valores de operação/limpeza não foram definidos no prompt. Informe os valores aprovados pelo Hub. Zero deve ser informado explicitamente quando não houver cobrança.</p><button>Salvar cadastro</button></form></main><footer th:replace="~{fragments :: rodape}"></footer><script src="/js/admin.js" defer></script></body></html>
