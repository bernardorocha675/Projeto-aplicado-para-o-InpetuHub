<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Cadastros')}"></head><body class="admin-body">
 <header th:replace="~{fragments :: topo}"></header><aside th:replace="~{fragments :: menu}"></aside><main class="admin-main"><div th:replace="~{fragments :: mensagens}"></div><div class="page-heading"><div><span class="eyebrow blue">CRM E GESTÃO</span><h1 th:text="${secao.titulo}"></h1></div><a th:unless="${tipo=='configuracao'||tipo=='personas'}" th:href="${rota}+'/editar'" class="button">Novo cadastro</a></div><section class="card"><form th:action="${rota}" method="get" class="filters"><label>Buscar<input name="busca" th:value="${busca}" placeholder="Nome, CNPJ, empresa, email..."></label><button>Buscar</button><a th:href="${rota}">Limpar</a></form><div class="table-scroll"><table><thead><tr><th>#</th><th th:each="c,iter:${secao.campos}" th:if="${iter.index<6 && c.nome!='senha'}" th:text="${c.rotulo}"></th><th>Ações</th></tr></thead><tbody><tr th:each="o:${registros}"><td th:text="${o.id}"></td><td th:each="c,iter:${secao.campos}" th:if="${iter.index<6 && c.nome!='senha'}" th:text="${crud.exibicao(o,c.nome)}"></td><td class="row-actions"><a th:if="${tipo=='empreendedores'}" th:href="@{/admin/empreendedores/{id}(id=${o.id})}">Perfil</a><a th:href="${rota}+'/editar?id='+${o.id}">Editar</a><form th:if="${tipo=='visitas'||tipo=='atendimentos'||tipo=='espacos'||tipo=='feriados'||tipo=='precos'}" th:action="${rota}+'/'+${o.id}+'/excluir'" method="post" class="confirm-delete"><button class="link danger-text" type="submit">Excluir</button></form></td></tr><tr th:if="${#lists.isEmpty(registros)}"><td colspan="8" class="empty">Nenhum cadastro encontrado.</td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: rodape}"></footer><script src="/js/admin.js" defer></script></body></html>
