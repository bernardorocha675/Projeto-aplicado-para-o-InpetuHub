<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Solicitações recebidas')}"></head><body class="admin-body"><header th:replace="~{fragments :: topo}"></header><aside th:replace="~{fragments :: menu}"></aside><main class="admin-main"><h1>Solicitações recebidas</h1><p>Os dados abaixo são declarações do solicitante, sem vínculo confirmado com o CRM. Conferir documento e contato não prova representação da instituição: confirme com um responsável conhecido antes de encaminhar. Nenhum horário está bloqueado.</p><article class="card" th:each="s:${items}"><h2 th:text="${s.form.titulo}"></h2><p th:text="${s.form.nome}+' · '+${s.form.empresa}+' · '+${T(br.com.inpetu.hub.validation.Documentos).exibir(s.form.tipoDocumento,s.form.cnpj)}"></p><p th:text="${s.form.email}+' · '+${s.form.telefone}"></p><p th:text="${s.form.data}+' · '+${s.form.horaInicio}+'–'+${s.form.horaFim}"></p><p th:text="${s.form.objetivo}"></p><p th:text="'Email confirmado: '+${s.emailConfirmado}+' · Expira: '+${s.expiraEm}"></p><form th:action="@{/admin/solicitacoes/{id}/aceitar(id=${s.id})}" method="post"><label class="check"><input type="checkbox" name="identity" value="true" required>Conferi a identidade e o vínculo com a instituição por um contato confiável *</label><label>Como foi conferido *<textarea name="reason" maxlength="2000" required></textarea></label><button>Encaminhar para análise da reserva</button></form><form th:action="@{/admin/solicitacoes/{id}/recusar(id=${s.id})}" method="post"><button class="secondary">Recusar</button></form></article></main></body></html>
