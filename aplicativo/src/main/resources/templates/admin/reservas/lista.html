<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Reservas')}"></head><body class="admin-body">
 <header th:replace="~{fragments :: topoInterno}"></header><aside th:replace="~{fragments :: menu}"></aside><main class="admin-main"><div th:replace="~{fragments :: mensagens}"></div><div class="page-heading"><div><span class="eyebrow blue">GESTÃO DA AGENDA</span><h1>Reservas</h1></div></div><nav class="tabs" aria-label="Status de reserva"><a href="/admin/reservas?status=PENDENTE">Pendentes</a><a href="/admin/reservas?status=APROVADA">Aprovadas</a><a href="/admin/reservas?status=RECUSADA">Recusadas</a><a href="/admin/reservas?status=CANCELADA">Canceladas</a><a href="/admin/reservas">Todas</a></nav><section class="card"><form th:action="@{/admin/reservas}" method="get" class="filters"><label>Data<input name="data" type="date" th:value="${filtroData}"></label><label>Status<select name="status"><option value="">Todos</option><option th:each="s:${T(br.com.inpetu.hub.enums.StatusReserva).values()}" th:value="${s}" th:text="${s}" th:selected="${s==filtroStatus}"></option></select></label><label>Espaço<select name="espaco"><option value="">Todos</option><option th:each="e:${espacos}" th:value="${e.id}" th:text="${e.nomeEspaco}" th:selected="${e.id==filtroEspaco}"></option></select></label><label>Persona<select name="persona"><option value="">Todas</option><option th:each="p:${personas}" th:value="${p.id}" th:text="${p.codigo}" th:selected="${p.id==filtroPersona}"></option></select></label><label>Empreendedor<input name="busca" th:value="${busca}" placeholder="Nome, empresa ou CNPJ"></label><button>Filtrar</button><a href="/admin/reservas">Limpar</a></form><div th:replace="~{fragments :: tabelaReservas(${reservas})}"></div></section></main><footer th:replace="~{fragments :: rodapeInterno}"></footer><script src="/js/admin.js" defer></script></body></html>
