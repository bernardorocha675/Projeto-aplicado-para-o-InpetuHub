<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Solicitação recebida')}"></head>
  <body>
    <header th:replace="~{fragments :: topo}"></header>
    <main id="conteudo" class="public-main">
      <div th:replace="~{fragments :: mensagens}"></div>
      <section class="card confirmation">
        <span class="confirmation-icon">✓</span>
        <h1>Solicitação recebida!</h1>
        <p th:if="${numero}" th:text="'Sua reserva é a #'+${numero}+'.'"></p>
        <p>A equipe do InPETU Hub analisará a solicitação. Seu horário está reservado provisoriamente.</p>
        <p class="muted">Você receberá email quando o envio estiver configurado.</p>
        <a href="/agenda" class="button">Voltar à agenda</a>
      </section>
    </main>
    <footer th:replace="~{fragments :: rodape}"></footer>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
