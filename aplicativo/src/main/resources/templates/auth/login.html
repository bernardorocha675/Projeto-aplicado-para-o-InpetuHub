<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Entrar')}"></head><body>
 <header th:replace="~{fragments :: topoInterno}"></header><main class="public-main"><div th:replace="~{fragments :: mensagens}"></div><section class="card login-card"><span class="eyebrow blue">ÁREA INTERNA</span><h1>Bem-vindo ao Hub</h1><p>Acesse a gestão de reservas e relacionamentos.</p><p class="alert error" th:if="${param.error}">Usuário ou senha incorretos. Confira os dados e tente novamente.</p><p class="alert success" th:if="${param.logout}">Você saiu da área interna.</p><p class="login-help">Digite seu usuário e sua senha.</p><form th:action="@{/login}" method="post"><label>Usuário *<input name="username" type="text" autocapitalize="none" spellcheck="false" autocomplete="username" required></label><label>Senha *<input name="password" type="password" autocapitalize="none" spellcheck="false" autocomplete="current-password" required></label><button type="submit">Entrar</button></form></section></main><footer th:replace="~{fragments :: rodapeInterno}"></footer><script src="/js/admin.js" defer></script></body></html>
