<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Confira os dados')}"></head>
  <body>
    <header th:replace="~{fragments :: topo}"></header>
    <main id="conteudo" class="public-main">
      <div th:replace="~{fragments :: mensagens}"></div>
      <section class="card confirmation">
        <h1>Não foi possível concluir</h1>
        <p class="alert error" th:text="${mensagem ?: 'Ocorreu um erro. Confira os dados e tente novamente.'}"></p>
        <button type="button" class="voltar">Voltar e corrigir</button> <a href="/agenda" class="button secondary">Agenda</a>
        <p th:if="${requestId}" class="muted">Referência para suporte: <span th:text="${requestId}"></span></p>
      </section>
    </main>
    <footer th:replace="~{fragments :: rodape}"></footer>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
