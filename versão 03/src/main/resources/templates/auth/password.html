<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Alterar senha')}"></head><body><header th:replace="~{fragments :: topo}"></header><main class="public-main"><section class="card login-card"><h1>Alterar senha</h1><p>A alteração encerra todas as suas sessões. Use de 16 a 64 caracteres.</p><form th:action="@{/conta/senha}" method="post"><label>Senha atual<input name="current" type="password" autocomplete="current-password" maxlength="128" required></label><label>Nova senha<input name="replacement" type="password" autocomplete="new-password" minlength="16" maxlength="64" required></label><button>Alterar e sair</button></form></section></main></body></html>
