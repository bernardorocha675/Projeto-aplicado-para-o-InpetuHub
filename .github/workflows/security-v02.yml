name: Segurança e compatibilidade da versão 02
on:
  push:
    branches: ['main', 'security-v02']
    paths: ['versão 02/**', '.github/**']
  pull_request:
    paths: ['versão 02/**', '.github/**']
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: versão 02
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Configurar Linux e macOS
        if: runner.os != 'Windows'
        run: bash configurar.sh
      - name: Configurar Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: configurar.bat
      - name: Executar roteiro automático Linux e macOS
        if: runner.os != 'Windows'
        run: bash testar.sh
      - name: Executar roteiro automático Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: testar.bat
      - name: Guardar relatório sem credenciais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testes-${{ matrix.os }}
          path: |
            versão 02/relatorios-testes/ultimo.html
            versão 02/relatorios-testes/ultimo.txt
          if-no-files-found: ignore
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar exclusão de dados privados
        run: python 'versão 02/scripts/check_secrets.py'
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: versão 02
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp dependency:list -DincludeScope=runtime -DoutputFile=target/dependencies.txt
      - run: python scripts/check_dependencies.py
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - run: mvn -B -ntp -DskipTests clean package
        working-directory: versão 02
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:java-v02
          output: ${{ github.workspace }}/results
      - name: Conferir resultados CodeQL
        run: |
          python - <<'PYCODE'
          import json, pathlib
          paths = list(pathlib.Path('results').glob('*.sarif'))
          if not paths:
              raise SystemExit('SARIF ausente: análise não comprovada.')
          findings = []
          for path in paths:
              for run in json.loads(path.read_text()).get('runs', []):
                  findings.extend(run.get('results', []))
          for item in findings:
              print(item.get('ruleId'), item.get('level'), item.get('message', {}).get('text', ''))
          print('Resultados CodeQL:', len(findings))
          if findings:
              raise SystemExit('Revise os resultados CodeQL antes de publicar.')
          PYCODE
