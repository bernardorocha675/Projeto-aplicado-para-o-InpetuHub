name: Sistema (reescrita) — pacote e pré-release
# Gera e testa o pacote do sistema novo para Linux x64 e Windows x64 (decisão 11; sem ARM64 nem macOS).
# Em PR, só gera e testa. A pré-release só é publicada à mão (Actions → Run workflow) com "publicar" marcado,
# a partir da main, depois do ok do responsável. Tags e assets publicados nunca são movidos nem substituídos.
on:
  pull_request:
    paths: ['sistema/**', 'inicializador/**', 'scripts/**', '.github/workflows/sistema-release.yml']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da pré-release (1.0.0-alpha.N)'
        required: true
      publicar:
        description: 'Publicar a pré-release no GitHub (só com o ok do responsável)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sistema-release-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSAO: ${{ github.event.inputs.versao || '1.0.0-alpha.999' }}
  # Só em PR: um pacote de versão menor, para testar a passagem do executável antigo para o iniciador novo.
  VERSAO_ANTERIOR: 1.0.0-alpha.998
defaults:
  run:
    shell: bash
jobs:
  jar:
    name: Jar do sistema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir a versão
        run: |
          if ! [[ "$VERSAO" =~ ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Versão fora da linha 1.x: $VERSAO"; exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: sistema/pom.xml
      - name: Gerar o jar (até 3 tentativas de download)
        timeout-minutes: 10
        working-directory: sistema
        run: |
          for tentativa in 1 2 3; do
            if ./mvnw -B -ntp -q clean package -DskipTests; then exit 0; fi
            echo "Falhou; nova tentativa $((tentativa + 1)) de 3 em $((tentativa * 10)) s."
            sleep $((tentativa * 10))
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jar
          path: sistema/target/inpetu-hub-sistema.jar
          retention-days: 1
  pacote:
    name: Pacote ${{ matrix.plataforma }}
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, plataforma: Linux-x64, python: python3, jdk: temurin}
          - {os: windows-2025, plataforma: Windows-x64, python: python, jdk: temurin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PY: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: ${{ matrix.jdk }}
          java-version: '25'
      - name: Python com tkinter e venv (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk python3-venv
      - name: Python com tkinter (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jar
          path: sistema/target
      - name: Testar o iniciador (com o jar de verdade)
        timeout-minutes: 8
        working-directory: inicializador
        env:
          INPETU_JAR: ${{ github.workspace }}/sistema/target/inpetu-hub-sistema.jar
        run: $PY -m unittest discover -s testes -t . -v
      - name: Testar os scripts
        timeout-minutes: 3
        run: $PY -m unittest discover -s scripts/tests -t scripts -v
      - name: Gerar o pacote
        timeout-minutes: 12
        run: $PY scripts/build_pacote.py --versao "$VERSAO" --pular-maven --saida dist
      - name: Conferir o nome do pacote
        run: test -f "dist/InPETU-Hub-${{ matrix.plataforma }}-v$VERSAO.zip"
      - name: Gerar um pacote anterior (para testar a passagem)
        if: github.event_name == 'pull_request'
        timeout-minutes: 12
        run: $PY scripts/build_pacote.py --versao "$VERSAO_ANTERIOR" --pular-maven --saida anterior
      - name: Teste de fumaça do pacote
        timeout-minutes: 12
        run: |
          pacote="dist/InPETU-Hub-${{ matrix.plataforma }}-v$VERSAO.zip"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            $PY scripts/smoke_pacote.py "$pacote" --anterior "anterior/InPETU-Hub-${{ matrix.plataforma }}-v$VERSAO_ANTERIOR.zip"
          else
            $PY scripts/smoke_pacote.py "$pacote"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pacote-${{ matrix.plataforma }}
          path: dist/
          retention-days: 7
  publicar:
    name: Publicar a pré-release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publicar == 'true' && github.ref == 'refs/heads/main'
    needs: pacote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pacote-*
          path: baixados
      - name: Juntar os pacotes e o SHA256SUMS
        run: |
          mkdir publicar
          mv baixados/*/*.zip publicar/
          cd publicar && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
          test "$(ls *.zip | wc -l)" = 2
      - name: Publicar (sem mover tag nem substituir release existente)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSAO" --repo "$REPOSITORIO" > /dev/null 2>&1; then
            echo "A release v$VERSAO já existe: nada é substituído."; exit 1
          fi
          printf 'Pré-release do sistema novo (reescrita, linha 1.x), para Linux x64 e Windows x64.\n\nBaixe o pacote do seu computador, extraia e abra o inpetu-hub (no Windows, inpetu-hub.exe). Os dados ficam em ~/.config/InPETU-Hub/1 no Linux e em %%LOCALAPPDATA%%\\InPETU-Hub\\1 no Windows (o sistema antigo, em InPETU-Hub/0.4, não é tocado).\n' > notas.md
          gh release create "v$VERSAO" --repo "$REPOSITORIO" --target "$GITHUB_SHA" --prerelease \
            --title "InPETU Hub $VERSAO (pré-release)" --notes-file notas.md publicar/*.zip publicar/SHA256SUMS.txt
