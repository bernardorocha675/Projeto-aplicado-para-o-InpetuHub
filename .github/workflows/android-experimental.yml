name: Android — experimental offline
on:
  push:
    branches: ['main', 'release/android-experimental']
    paths: ['android/**', 'docs/ANDROID.md', 'docs/HANDOVER-ANDROID.md', '.github/workflows/android-experimental.yml']
  pull_request:
    paths: ['android/**', 'docs/ANDROID.md', 'docs/HANDOVER-ANDROID.md', '.github/workflows/android-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK e emulador oficiais
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Conferir fontes e proteção dos dados
        run: |
          python aplicativo/scripts/check_secrets.py
          python -m py_compile android/scripts/*.py
          python - <<'PY'
          import xml.etree.ElementTree as E
          r=E.parse('android/AndroidManifest.xml').getroot()
          assert not r.findall('uses-permission'), 'O APK offline não precisa de permissões.'
          assert r.find('application').attrib['{http://schemas.android.com/apk/res/android}allowBackup']=='false'
          PY
      - name: Preparar assinatura e backup criptografado
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python android/scripts/signing.py
      - name: Compilar e verificar APKs assinados
        run: python android/scripts/build.py
      - name: Validar instalação, banco e interface no Android 15
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name inpetu --package 'system-images;android-35;google_apis;x86_64' --device pixel_4
          adb start-server
          emulator -avd inpetu -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 > /tmp/inpetu-emulator.log 2>&1 &
          python - <<'PY'
          import subprocess,time
          end=time.monotonic()+240
          while time.monotonic()<end:
              r=subprocess.run(['adb','shell','getprop','sys.boot_completed'],text=True,capture_output=True,timeout=10)
              if r.stdout.strip()=='1':break
              time.sleep(2)
          else:
              from pathlib import Path
              print(Path('/tmp/inpetu-emulator.log').read_text()[-24000:])
              raise SystemExit('Emulador não iniciou no prazo.')
          PY
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          adb shell svc wifi disable
          adb shell svc data disable
          adb install android/dist/InPETU-Hub-Android-*.apk
          adb install android/dist/inpetu-android-test.apk
          timeout 300 adb shell am instrument -w br.com.inpetu.hub.experimental.test/br.com.inpetu.android.TestRunner | tee android/dist/TESTE-ANDROID.txt
          python - <<'PY'
          from pathlib import Path
          text=Path('android/dist/TESTE-ANDROID.txt').read_text()
          assert 'TESTES ANDROID APROVADOS: 16' in text,text
          assert 'TESTES ANDROID FALHARAM' not in text,text
          PY
          mkdir -p android/dist/screenshots
          adb pull /sdcard/Android/data/br.com.inpetu.hub.experimental/files/ android/dist/screenshots/
          adb shell am force-stop br.com.inpetu.hub.experimental
          adb shell am start -W -n br.com.inpetu.hub.experimental/br.com.inpetu.android.MainActivity
      - name: Guardar evidências e APK de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-experimental-evidencias
          path: |
            android/dist/InPETU-Hub-Android-*.apk
            android/dist/TESTE-ANDROID.txt
            android/dist/screenshots/
            android/dist/assinatura-android-backup.p7m
          if-no-files-found: ignore
  publish:
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-experimental-evidencias
          path: android/dist
      - name: Publicar prerelease Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: python android/scripts/publish.py
