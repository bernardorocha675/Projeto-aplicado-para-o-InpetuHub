name: Verificar versao 01 (temporario)

on:
  push:
    paths:
      - '.github/workflows/verificar-versao-01-temporario.yml'

permissions:
  contents: read

jobs:
  compatibilidade:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-11-arm
    defaults:
      run:
        working-directory: 'versão 01'
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Linux e macOS
        if: runner.os != 'Windows'
        shell: bash
        run: bash configurar.sh
      - name: Configurar Windows com o PowerShell do sistema
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAVA_HOME = ''
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          .\configurar.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Iniciar e verificar agenda, login, API e banco
        shell: python
        run: |
          import os, subprocess, time, urllib.request, urllib.parse, urllib.error, http.cookiejar, re, json
          from pathlib import Path
          command = ['cmd.exe', '/d', '/c', 'iniciar.bat'] if os.name == 'nt' else ['bash', 'iniciar.sh']
          env = os.environ.copy()
          env['PORT'] = '18080'
          with open('inicializacao-ci.log', 'w', encoding='utf-8') as log:
              process = subprocess.Popen(command, env=env, stdout=log, stderr=subprocess.STDOUT)
              try:
                  base = 'http://127.0.0.1:18080'
                  client = urllib.request.build_opener(urllib.request.ProxyHandler({}), urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                  for attempt in range(120):
                      if process.poll() is not None:
                          raise RuntimeError('Servidor saiu com codigo ' + str(process.returncode))
                      try:
                          with client.open(base + '/', timeout=2) as response:
                              assert response.status == 200
                          break
                      except (urllib.error.URLError, TimeoutError):
                          time.sleep(1)
                  else:
                      raise RuntimeError('Servidor nao iniciou em 120 segundos')
                  with client.open(base + '/login', timeout=10) as response:
                      html = response.read().decode('utf-8')
                  token = re.search(r'name="_csrf"[^>]*value="([^"]+)"', html).group(1)
                  data = urllib.parse.urlencode({'username': 'admin@inpetuhub.local', 'password': 'Inpetu@123', '_csrf': token}).encode()
                  with client.open(base + '/login', data=data, timeout=10) as response:
                      assert response.status == 200 and response.geturl().endswith('/admin'), response.geturl()
                  with client.open(base + '/disponibilidade?mes=2026-11', timeout=10) as response:
                      assert json.load(response)['dias']
                  assert Path('data/inpetu.mv.db').exists()
                  print('Agenda, login, dashboard, API e banco H2: OK')
              except Exception:
                  print(Path('inicializacao-ci.log').read_text(encoding='utf-8', errors='replace'))
                  raise
              finally:
                  if os.name == 'nt':
                      subprocess.run(['taskkill', '/PID', str(process.pid), '/T', '/F'], check=False)
                  else:
                      process.terminate()
                      try:
                          process.wait(timeout=20)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
