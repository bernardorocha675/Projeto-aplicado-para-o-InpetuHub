name: Versão 0.4 — executáveis e compatibilidade
on:
  push:
    branches: ['main', 'release-v0.4']
    paths: ['aplicativo/**', 'iniciador/**', 'receptor/**', '.github/**', '.gitleaks*', 'VERSION', 'RELEASE-NOTES.md', 'RELEASES.md']
  pull_request:
    paths: ['aplicativo/**', 'iniciador/**', 'receptor/**', '.github/**', '.gitleaks*', 'VERSION', 'RELEASE-NOTES.md', 'RELEASES.md']
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, goos: linux, goarch: amd64, javaarch: x64}
          - {os: ubuntu-24.04-arm, goos: linux, goarch: arm64, javaarch: aarch64}
          - {os: macos-15, goos: darwin, goarch: arm64, javaarch: aarch64}
          - {os: macos-15-intel, goos: darwin, goarch: amd64, javaarch: x64}
          - {os: windows-2025, goos: windows, goarch: amd64, javaarch: x64}
          - {os: windows-11-arm, goos: windows, goarch: arm64, javaarch: aarch64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: aplicativo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.javaarch }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          architecture: ${{ matrix.goarch }}
          cache: false
      - name: Testar e conferir o iniciador
        working-directory: iniciador
        run: |
          go test -v ./...
          go vet ./...
      - name: Preparar Maven para compilação e testes
        run: python ../.github/scripts/setup_maven.py
      - name: Executar testes de regras, HTTP e backup
        run: java "-Dfile.encoding=UTF-8" --source 17 scripts/Testar.java
      - name: Gerar executável e runtime privado
        env:
          INPETU_GOOS: ${{ matrix.goos }}
          INPETU_GOARCH: ${{ matrix.goarch }}
        run: python ../.github/scripts/package_v04.py
      - name: Testar pacote real sem Java externo nem arquivo de senhas
        run: python ../.github/scripts/smoke_v04.py
      - name: Guardar executáveis públicos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-v04-${{ matrix.goos }}-${{ matrix.goarch }}
          compression-level: 0
          path: |
            aplicativo/dist/*.zip
            aplicativo/dist/*.exe
            aplicativo/dist/*.run
          if-no-files-found: error
      - name: Guardar relatório sem credenciais
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: testes-v0.4-${{ matrix.os }}
          path: |
            aplicativo/relatorios-testes/ultimo.html
            aplicativo/relatorios-testes/ultimo.txt
          if-no-files-found: ignore
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Testar interfaces da agenda e cadastros
        run: |
          node .github/scripts/test_agenda_ui.cjs
          node .github/scripts/test_admin_ui.cjs
      - name: Testar receptor, identidade e publicação dos relatórios
        run: node --test 'receptor/test.mjs'
      - name: Verificar exclusão de dados privados
        run: python 'aplicativo/scripts/check_secrets.py'
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aplicativo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp dependency:list -DincludeScope=runtime -DoutputFile=target/dependencies.txt
      - run: python scripts/check_dependencies.py
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - run: mvn -B -ntp -DskipTests clean package
        working-directory: aplicativo
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:java-v03
          output: ${{ github.workspace }}/results
      - name: Conferir resultados CodeQL
        run: |
          python - <<'PYCODE'
          import json, pathlib
          paths = list(pathlib.Path('results').glob('*.sarif'))
          if not paths:
              raise SystemExit('SARIF ausente: análise não comprovada.')
          findings = []
          for path in paths:
              for run in json.loads(path.read_text()).get('runs', []):
                  findings.extend(run.get('results', []))
          for item in findings:
              print(item.get('ruleId'), item.get('level'), item.get('message', {}).get('text', ''))
          print('Resultados CodeQL:', len(findings))
          if findings:
              raise SystemExit('Revise os resultados CodeQL antes de publicar.')
          PYCODE
  ci-report:
    name: Publicar relatório da CI
    needs: [native, source, dependencies, codeql]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publicar-relatorios-testes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publicar versão e resultado dos ambientes testados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/collect-reports.mjs --ci
  release:
    name: Publicar executáveis 0.4
    needs: [native, source, dependencies, codeql, ci-report]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publicar-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-v04-*
          path: release-assets
          merge-multiple: true
      - name: Conferir e publicar os pacotes testados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/publish_v04.py
